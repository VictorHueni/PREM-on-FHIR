version: 2

models:
  - name: mart_prem_kpi_daily
    description: "Daily PREM KPIs by org × clinician × encounter_class with domain means."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_date, org_id, clinician_id, encounter_class]
    columns:
      - name: org_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
      - name: clinician_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_practitioner')
                field: practitioner_id
              config: {severity: warn}
      - name: encounter_class
        description: "FHIR Encounter.class; may be UNKNOWN if missing."

  - name: mart_prem_item_heatmap
    description: "Monthly item × org heatmap: mean score, top-box %, problem rate, N."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_month, org_id, questionnaire_id, item_linkid]
    columns:
      - name: org_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id

  - name: mart_prem_equity_slice
    description: "Monthly equity slices by age band & gender with overall and per-domain means."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_month, org_id, age_band, gender_norm]
    columns:
      - name: org_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id

  - name: mart_prem_outliers
    description: "Monthly z-scores vs network mean for orgs & clinicians; |z| ≥ 2 flags."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_month, entity_type, entity_id]

  - name: mart_prem_kpi_domains
    description: >
      Exploded domain-level KPIs derived from mart_prem_kpi_monthly.
      One row per period_month × org_id × domain_key, with score and top-2-box metrics.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_month, org_id, domain_key]
    columns:
      - name: period_month
        description: "Month of questionnaire response aggregation"
        tests: [not_null]
      - name: org_id
        description: "Organization identifier"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
      - name: domain_key
        description: "Domain name or code (e.g., Communication, Coordination)"
        tests: [not_null]
      - name: score_pct_mean
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: { severity: warn }
      - name: top_box_pct_mean
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: { severity: warn }

  - name: mart_prem_theme_sentiment_matrix
    description: >
      Theme × Sentiment summary per period_month and org_id.
      Provides n_comments, total per theme, and pct_within_theme (share of sentiment within each theme).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_month, org_id, theme_primary, sentiment_label]
    columns:
      - name: period_month
        tests: [not_null]
      - name: org_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
      - name: theme_primary
        description: "Primary theme label; 'Uncategorized' when missing."
        tests: [not_null]
      - name: sentiment_label
        description: "Sentiment label (positive, neutral, negative, unscored)."
        tests: [not_null]
      - name: n_comments
        description: "Count of comments for this Theme × Sentiment."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: { severity: warn }
      - name: n_theme
        description: "Total comments for this Theme (same month/org)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: { severity: warn }
      - name: pct_within_theme
        description: "n_comments / n_theme; share of sentiment within the theme (0–1)."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: { severity: warn }

  - name: mart_prem_nps
    description: >
      Net Promoter Score (NPS) aggregates from PREM questionnaire responses.
      Provides counts of promoters, passives, and detractors, plus the NPS %
      at daily/weekly/monthly levels by org × clinician × encounter × patient.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [qr_date, org_id, clinician_id, encounter_id, patient_id]
    columns:
      - name: qr_date
        description: "Date of questionnaire response"
        tests: [not_null]
      - name: qr_week_start
        description: "Start of the ISO week for aggregation"
      - name: qr_month_start
        description: "Start of the month for aggregation"
      - name: org_id
        description: "Organization identifier"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
      - name: clinician_id
        description: "Practitioner providing care; may be null"
        tests:
          - relationships:
              arguments:
                to: ref('dim_practitioner')
                field: practitioner_id
              config: {severity: warn}
      - name: encounter_id
        description: "Encounter identifier linked to the NPS response"
      - name: patient_id
        description: "Patient identifier (pseudonymized)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
              config: {severity: warn}
      - name: promoters
        description: "Count of NPS responses scored 9–10"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: {severity: warn}
      - name: passives
        description: "Count of NPS responses scored 7–8"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: {severity: warn}
      - name: detractors
        description: "Count of NPS responses scored 0–6"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: {severity: warn}
      - name: total_responses
        description: "Total number of valid NPS responses in the group"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: {severity: warn}
      - name: nps_score_pct
        description: "Net Promoter Score as a percentage: 100 × (Promoters – Detractors) / Total"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between -100 and 100"
              config: {severity: warn}


                # ----------------------------
  # Home KPIs (single-row view)
  # ----------------------------
  - name: mart_home_kpis
    description: "Global KPIs: totals, 30-day trend, completion & coverage."
    columns:
      - name: responses_total
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: responses_last_30d
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: patients_total
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: avg_completion_scored
        description: "Mean completion ratio over scored items (0–1)."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}
      - name: pct_with_nps
        description: "Share of responses that include NPS (0–1)."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}
      - name: pct_with_freetext
        description: "Share of responses with ≥1 free-text comment (0–1)."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}

  # ------------------------------
  # Daily trend by questionnaire
  # ------------------------------
  - name: mart_home_trend_daily
    description: "Daily counts by questionnaire for headlines/sparkline."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_date, questionnaire_id]
    columns:
      - name: period_date
        tests: [not_null]
      - name: questionnaire_id
        tests: [not_null]
      - name: responses_n
        tests:
          - not_null
          - dbt_utils.expression_is_true: {expression: ">= 0"}
      - name: patients_n
        tests:
          - not_null
          - dbt_utils.expression_is_true: {expression: ">= 0"}

  # -----------------------------------------
  # Roll-up by questionnaire (all orgs)
  # -----------------------------------------
  - name: mart_home_by_questionnaire
    description: "Questionnaire-level roll-up: N, unique patients, NPS/text coverage, completion."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [questionnaire_id]
    columns:
      - name: questionnaire_id
        tests: [not_null]
      - name: responses_n
        tests:
          - not_null
          - dbt_utils.expression_is_true: {expression: ">= 0"}
      - name: patients_n
        tests:
          - not_null
          - dbt_utils.expression_is_true: {expression: ">= 0"}
      - name: pct_with_nps
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}
      - name: pct_with_freetext
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}
      - name: avg_completion_scored
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}

              
  # -------------------------------------------------
  # Staleness view with traffic-light buckets/scores
  # -------------------------------------------------

  - name: mart_home_staleness
    description: >
      Org × Questionnaire staleness/coverage snapshot with traffic-light
      freshness buckets and a combined staleness_score.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [org_id, questionnaire_id]
    columns:
      - name: org_id
        description: "Organization identifier"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id

      - name: questionnaire_id
        description: "Normalized questionnaire key (matches stg_* and facts)"
        tests: [not_null]

      - name: responses_n
        description: "Number of QuestionnaireResponses for this org × questionnaire"
        tests:
          - not_null
          - dbt_utils.expression_is_true: {expression: ">= 0"}

      - name: patients_n
        description: "Distinct patients responding in this org × questionnaire"
        tests:
          - not_null
          - dbt_utils.expression_is_true: {expression: ">= 0"}

      - name: pct_with_nps
        description: "Share of responses that include NPS (0–1)"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}

      - name: pct_with_freetext
        description: "Share of responses with ≥1 free-text answer (0–1)"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}

      - name: avg_completion_scored
        description: "Avg completion ratio over scored items (0–1)"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config: {severity: warn}

      - name: item_count_leaf
        description: "Total leaf items defined in questionnaire"
        tests:
          - dbt_utils.expression_is_true: {expression: ">= 0"}

      - name: item_count_scored
        description: "Leaf items counted as scored in questionnaire"
        tests:
          - dbt_utils.expression_is_true: {expression: ">= 0"}

      - name: last_seen_in_answers
        description: "Most recent authored_ts seen in stg_answers for this questionnaire"

      - name: days_since_last_answer
        description: "Days since last answer observed (reporting TZ)"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: {severity: warn}

      - name: answer_freshness
        description: "Traffic-light bucket for last answer (green/amber/red/unknown)"
        tests:
          - accepted_values:
              arguments:
                values: ['green','amber','red','unknown']
                quote: true

      - name: answer_severity
        description: "Numeric severity for last answer (0 best … 3 unknown)"
        tests:
          - dbt_utils.expression_is_true:
              expression: "in (0,1,2,3)"

      - name: questionnaire_last_updated
        description: "FHIR Questionnaire last_updated timestamp from raw"

      - name: days_since_last_update
        description: "Days since Questionnaire last updated (reporting TZ)"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: {severity: warn}

      - name: update_freshness
        description: "Traffic-light bucket for last update (green/amber/red/unknown)"
        tests:
          - accepted_values:
              arguments:
                values: ['green','amber','red','unknown']
                quote: true

      - name: update_severity
        description: "Numeric severity for last update (0 best … 3 unknown)"
        tests:
          - dbt_utils.expression_is_true:
              expression: "in (0,1,2,3)"

      - name: staleness_score
        description: "Combined severity (answers ×2 + update); lower is better"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: {severity: warn}


exposures:
  - name: prem_quality_dashboard
    type: dashboard
    maturity: medium
    url: "http://localhost:3000/dashboard/prem"
    description: "PREM quality & improvement dashboard for neurorehab."
    depends_on:
      - ref('mart_prem_kpi_daily')
      - ref('mart_prem_item_heatmap')
      - ref('mart_prem_equity_slice')
      - ref('mart_prem_outliers')
      - ref('mart_home_kpis')
      - ref('mart_home_trend_daily')
      - ref('mart_home_by_questionnaire')
      - ref('mart_home_staleness')
    owner:
      name: "Quality Analytics"
      email: "quality@example.com"