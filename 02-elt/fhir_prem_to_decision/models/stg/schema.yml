version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: questionnaireresponse_current
      - name: questionnaire_current
      - name: encounter_current
      - name: patient_current
      - name: practitioner_current
      - name: organization_current
      - name: codesystem_current

models:

  - name: stg_items
    description: "Questionnaire items (1 row per questionnaire_id × linkId) with hierarchy, ordering, and scoring hints."
    columns:
      - name: questionnaire_id
        tests: [not_null]
      - name: linkid
        tests: [not_null]
      - name: question_type
        tests:
          - accepted_values:
              arguments:
                values: ['group','display','boolean','decimal','integer','date','dateTime','time','string','choice','quantity']
                quote: true
              config:
                where: "question_type is not null"
                severity: error
      - name: is_leaf
      - name: item_order
      - name: domain_key
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [questionnaire_id, linkid]

  - name: stg_responses
    description: "One row per QuestionnaireResponse"
    columns:
      - name: qr_id
        tests: [not_null, unique]
      - name: questionnaire_id
        tests: [not_null]
      - name: authored_ts
        tests: [not_null]
      - name: encounter_ref
      - name: org_ref
      - name: clinician_ref
      - name: encounter_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_dim_encounters')
                field: encounter_id
              config:
                where: "encounter_id is not null"
      - name: loaded_at
        tests: [not_null]   # if Airbyte always populates it

  - name: stg_answers
    description: "Exploded answers with ordinals, scoring helpers, and top/bottom-box flags"
    columns:
      - name: answer_id
        tests: [not_null, unique]

      - name: qr_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_responses')
                field: qr_id

      - name: questionnaire_id
        tests: [not_null]

      - name: item_linkid
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_items')
                field: linkid

      - name: answer_ordinal
        tests: [not_null]

      - name: answer_kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['coding','string','integer','decimal','boolean','datetime','date','time','quantity','other']
                quote: true

      # Only enforce numeric_value for types that should be numeric
      - name: numeric_value
        tests:
          - not_null:
              config:
                where: "answer_kind in ('coding','integer','decimal','boolean','quantity')"
          # Limit accepted range to Likert-like codings only (avoid NPS 0–10 warnings)
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
              config:
                severity: warn
                where: "answer_kind='coding' and value_coding_system ilike '%likert%' and numeric_value is not null"

      # Optional: enforce presence of text on string answers
      - name: value_string
        tests:
          - not_null:
              config:
                where: "answer_kind = 'string'"

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [qr_id, item_linkid, answer_ordinal]

  - name: stg_dim_patients
    columns:
      - name: patient_id
        tests: [not_null, unique]
      - name: gender_norm
        tests:
          - accepted_values:
              arguments:
                values: ['male','female','other','unknown']
                quote: true

  - name: stg_dim_encounters
    columns:
      - name: encounter_id
        tests: [not_null, unique]
      - name: patient_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_dim_patients')
                field: patient_id
              config:
                where: "patient_id is not null"
      - name: encounter_class
        tests:
          - accepted_values:
              arguments:
                values: ['IMP','AMB','EMER','INPATIENT','OUTPATIENT','ER','ED']
                quote: true
              config:
                severity: warn

  - name: stg_dim_practitioners
    columns:
      - name: practitioner_id
        tests: [not_null, unique]

  - name: stg_dim_organizations
    description: "Organizations (facilities/departments) with type, hierarchy, contact & address."
    columns:
      - name: org_id
        tests: [not_null, unique]
      - name: org_kind_norm
        tests:
          - accepted_values:
              arguments:
                values: ['provider','department','team','payor','insurer','government','education','religious','clinical-research','other','unknown']
                quote: true
