version: 2

models:
  - name: fact_prem_answer
    description: "Conformed PREM answers at grain qr_id × item_linkid × answer_ordinal."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [qr_id, item_linkid, answer_ordinal]
    columns:
      - name: qr_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_responses')
                field: qr_id

      - name: item_linkid
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_items')
                field: linkid

      - name: answer_ordinal
        tests: [not_null]

      - name: numeric_value
        tests:
          # Metaplane syntax: put the test under the column and use row_condition
          - dbt_expectations.expect_column_values_to_not_be_null:
              arguments:
                row_condition: "answer_kind in ('coding','integer','decimal','boolean','quantity')"
          # (Optional) keep the built-in guard as warn if you like redundancy
          # - not_null:
          #     config:
          #       where: "answer_kind in ('coding','integer','decimal','boolean','quantity')"
          #       severity: warn

      - name: patient_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
              config: { severity: warn }

      - name: encounter_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_encounter')
                field: encounter_id
              config: { severity: warn }

      - name: clinician_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_practitioner')
                field: practitioner_id
              config: { severity: warn }

      - name: org_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
              config: { severity: warn }

      - name: questionnaire_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_items')
                field: questionnaire_key

  - name: fact_prem_response
    description: "One row per QuestionnaireResponse with overall & coverage metrics."
    columns:
      - name: qr_id
        tests: [not_null, unique]

      - name: patient_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
              config: { severity: warn }

      - name: encounter_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_encounter')
                field: encounter_id
              config: { severity: warn }

      - name: clinician_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_practitioner')
                field: practitioner_id
              config: { severity: warn }

      - name: org_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
              config: { severity: warn }

      # Range checks: attach to column; no column_name; metaplane docs show min/max (+ optional row_condition/strictly)
      - name: overall_top_box_pct
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: overall_top2_box_pct
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: response_completeness_pct
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: fact_prem_response_domain
    description: "Per-response per-domain metrics."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [qr_id, domain_key]
    columns:
      - name: qr_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_prem_response')
                field: qr_id
      - name: domain_key
        tests: [not_null]

  - name: dim_patient
    columns:
      - name: patient_id
        tests: [not_null, unique]

  - name: dim_encounter
    columns:
      - name: encounter_id
        tests: [not_null, unique]

  - name: dim_practitioner
    columns:
      - name: practitioner_id
        tests: [not_null, unique]

  - name: dim_organization
    columns:
      - name: org_id
        tests: [not_null, unique]
