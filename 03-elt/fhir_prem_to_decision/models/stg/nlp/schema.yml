version: 2

models:
  - name: nlp_prem_text
    description: Free-text PREM answers with context, ready for scoring.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [qr_id, item_linkid]
    columns:
      - name: qr_id
        tests: [not_null]
      - name: item_linkid
        tests: [not_null]
      - name: text_raw
        tests: [not_null]

  - name: nlp_predictions_inbox
    description: Inbox table for ML predictions (may contain multiple runs).
    columns:
      - name: qr_id
        tests: [not_null]
      - name: item_linkid
        tests: [not_null]
      - name: created_at
        tests: [not_null]
      - name: run_id
        description: Identifier of the scoring batch. Multiple runs allowed.
      - name: sentiment_label
        description: Optional. 'positive' | 'neutral' | 'negative' (or custom).
      - name: sentiment_score
        description: Optional numeric score (e.g., -1..+1).

  - name: mart_prem_text_sentiment
    description: One row per free-text answer joined to latest prediction for dashboard use.
    columns:
      - name: org_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
      - name: clinician_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_practitioner')
                field: practitioner_id

  - name: mart_prem_theme_summary
    description: Theme-level monthly aggregates with sentiment counts and averages.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_month, org_id, theme_primary]
    columns:
      - name: period_month
        tests: [not_null]
      - name: org_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: org_id
